# 第 48 天：nginx 放在最前面：HTTPS、限制请求体大小、把请求转给 web。
# 生产上要加 HTTPS（listen 443 ssl，证书可以用 certbot 自动申请），这里只写转发的部分。
upstream research_web {
  server web:8080;
  keepalive 16;
}

server {
  listen 80;
  # 和第 47 天的上传上限一致
  client_max_body_size 20m;

  location / {
    proxy_pass http://research_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SSE：不要缓冲（否则用户要等到攒满一块才看到进度），连接可以开很久（深度研究要好几分钟）
  location ~ ^/(api/research|v1/jobs/[^/]+/events)$ {
    proxy_pass http://research_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
}
