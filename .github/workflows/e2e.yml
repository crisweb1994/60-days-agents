name: E2E

# 每周用真实的默认模型跑一遍所有参考答案，及时发现模型接口的变化。
# 先在仓库的 Settings → Secrets and variables → Actions 里配置：
#   变量 OPENAI_BASE_URL、OPENAI_MODEL，密钥 OPENAI_API_KEY
#   变量 ANTHROPIC_BASE_URL、ANTHROPIC_MODEL，密钥 ANTHROPIC_API_KEY（第 8 天起用到）
#   变量 EMBEDDING_MODEL，可选的变量 EMBEDDING_BASE_URL 和密钥 EMBEDDING_API_KEY（第 17 天起用到，不配时沿用 OPENAI_*）
#   可选的变量 CHEAP_MODEL（第 22 天起用来分类，不配时沿用 OPENAI_MODEL）
#   可选的变量 ALT_BASE_URL、ALT_MODEL 和密钥 ALT_API_KEY（第 33 天起横评用的第二家模型，不配时用 CHEAP_MODEL）
#   可选的变量 VISION_MODEL（第 47 天起读图用的视觉模型）
# 没配置 OPENAI_MODEL 之前，这个任务会自动跳过。
on:
  schedule:
    - cron: '0 2 * * 1' # 每周一 UTC 2:00
  workflow_dispatch:

jobs:
  e2e:
    if: vars.OPENAI_MODEL != ''
    runs-on: ubuntu-latest
    env:
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      CHEAP_MODEL: ${{ vars.CHEAP_MODEL }}
      ALT_BASE_URL: ${{ vars.ALT_BASE_URL }}
      ALT_MODEL: ${{ vars.ALT_MODEL }}
      ALT_API_KEY: ${{ secrets.ALT_API_KEY }}
      VISION_MODEL: ${{ vars.VISION_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --e2e
