# 第 48 天：单机部署。一台云服务器上跑：web（接口和网页）、worker（后台研究任务）、PostgreSQL、Redis，前面一个 nginx。
#   cp days/day50/deploy/.env.production.example days/day50/deploy/.env.production   # 填好密钥
#   docker compose -f days/day50/deploy/docker-compose.yml --env-file days/day50/deploy/.env.production up -d --build
# --env-file 让 compose 读到里面的 POSTGRES_PASSWORD；env_file 再把整个文件交给 web 和 worker 容器
name: research-assistant

x-app: &app
  build:
    context: ../../..
    dockerfile: days/day50/deploy/Dockerfile
  image: ${IMAGE:-research-assistant:local}
  env_file: .env.production
  volumes:
    - app-data:/data
  restart: unless-stopped
  # 比应用的 SHUTDOWN_TIMEOUT_MS（25 秒）长，优雅退出才来得及做完；默认只有 10 秒
  stop_grace_period: 40s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    environment:
      ROLE: web
      DATABASE_URL: postgres://research:${POSTGRES_PASSWORD:?用 --env-file 指定的文件里要有 POSTGRES_PASSWORD}@postgres:5432/research
      REDIS_URL: redis://redis:6379
    expose:
      - "8080"

  worker:
    <<: *app
    environment:
      ROLE: worker
      DATABASE_URL: postgres://research:${POSTGRES_PASSWORD}@postgres:5432/research
      REDIS_URL: redis://redis:6379
    # 要更多 worker 就 docker compose up -d --scale worker=3
    deploy:
      replicas: 1

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: research
      POSTGRES_DB: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly：Redis 重启以后队列里的任务还在
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  app-data:
  pg-data:
  redis-data:
