name: E2E

# 每周用真实的默认模型跑一遍所有参考答案，及时发现模型接口的变化。
# 先在仓库的 Settings → Secrets and variables → Actions 里配置：
#   变量 OPENAI_BASE_URL、OPENAI_MODEL，密钥 OPENAI_API_KEY
# 没配置 OPENAI_MODEL 之前，这个任务会自动跳过。
on:
  schedule:
    - cron: '0 2 * * 1' # 每周一 UTC 2:00
  workflow_dispatch:

jobs:
  e2e:
    if: vars.OPENAI_MODEL != ''
    runs-on: ubuntu-latest
    env:
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --e2e
